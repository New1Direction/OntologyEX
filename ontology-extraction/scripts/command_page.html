<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OntologyEX / Command center</title>
<style>
:root{color-scheme:dark;--bg:#060b12;--panel:#0b131d;--panel2:#0f1a26;--line:#1d2c3b;--line2:#2a3d50;
--text:#dbe7f0;--muted:#7f93a6;--faint:#4d6176;--accent:#4cc3d9;--ok:#34d399;--warn:#f2c14e;--risk:#ff5d5d;--impact:#ff9a3c;
--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--sans);min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:#08101a;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font:600 11px var(--mono);letter-spacing:.22em;color:var(--accent)}
.brand span{font-weight:600;font-size:15px}
nav{display:flex;flex-wrap:wrap;max-width:100%;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
nav a{padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:500}
nav a[aria-current="page"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
nav a:hover{text-decoration:none;color:var(--text)}
main{max-width:1200px;margin:0 auto;padding:0 0 40px}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 10px;font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.summary{font-size:18px;margin:0 0 4px;font-weight:600}.note{color:var(--muted);font-size:12px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.kpi{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px}
.kpi b{display:block;font:600 22px var(--mono)}.kpi span{color:var(--muted);font-size:12px}
.kpi.ok b{color:var(--ok)}.kpi.risk b{color:var(--risk)}.kpi.unknown b{color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.two>.sec+.sec{border-left:1px solid var(--line)}
@media (max-width:760px){.two{grid-template-columns:1fr}.two>.sec+.sec{border-left:0}}
.cov{margin:0 0 10px}.cov .row{display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--panel2);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.check{display:flex;gap:8px;align-items:baseline;margin:0 0 6px}
.check .mark{font:600 10px var(--mono);white-space:nowrap}
.FOUND{color:var(--ok)}.NOT_FOUND_IN_SOURCES{color:var(--warn)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{background:var(--panel);color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font:500 12px var(--sans);cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--text);background:var(--panel2);border-color:var(--accent)}
.item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.score{font:600 22px var(--mono);text-align:center;line-height:1}
.score small{display:block;font:600 9px var(--mono);letter-spacing:.08em;margin-top:6px}
.CRITICAL{color:var(--risk)}.HIGH{color:var(--impact)}.MEDIUM{color:var(--warn)}.LOW{color:var(--muted)}
.item h3{margin:0;font-size:15px;overflow-wrap:anywhere}
.meta{color:var(--faint);font:11px var(--mono);margin-top:2px}
.why{margin:6px 0 0}
.factors{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.factor{border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font:11px var(--mono);color:var(--muted)}
.factor b{color:var(--text)}
.next{margin-top:8px;font-size:12px}.next b{color:var(--accent);font-weight:600}
.links{margin-top:6px;font-size:12px}.links a{margin-right:8px}
.empty{color:var(--faint);margin:0}
</style></head>
<body>
<header>
 <div class="brand"><b>ONTOLOGYEX</b><span>Command center</span></div>
 <nav><a href="/command" aria-current="page">Command</a><a href="/digest">Digest</a><a href="/owners">Owners</a><a href="/compliance">Compliance</a><a href="/operations">Operations</a><a href="/">System map</a><a href="/business">Business</a><a href="/entity">Entity</a><a href="/impact">Change impact</a><a href="/suppliers">Suppliers</a></nav>
</header>
<main id="body"></main>
<script>
"use strict";
// Everything that needs attention, ranked by importance, with the factors behind each score.
const $=id=>document.getElementById(id);
function h(tag,attrs={},...kids){const el=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){if(v==null)continue;if(k==="text")el.textContent=v;else if(k==="class")el.className=v;else el.setAttribute(k,v)}
 for(const c of kids){if(c!=null)el.append(c)}return el}
function link(o){return h("a",{href:"/entity?id="+encodeURIComponent(o.id),text:o.label||o.id})}
const LEVELS=["CRITICAL","HIGH","MEDIUM","LOW"];
// The owner beside an item: declared in CODEOWNERS, or who changed its code most in a year.
function ownerText(o){if(!o)return "";if(!o.owner)return " · owner: nobody";
 return ` · owner: ${o.owner} (${o.basis==="CODEOWNERS"?"CODEOWNERS":"most commits"}${o.through?", via what it runs on":""})`}
let data=null,level="ALL",category="ALL";
function item(i){
 return h("div",{class:"item","data-level":i.level},
  h("div",{class:"score "+i.level},String(i.score),h("small",{text:i.level})),
  h("div",{},h("h3",{},i.subject?link({id:i.subject.id,label:i.title}):i.title),
   h("div",{class:"meta",text:`${i.category} · ${i.kind.replace(/_/g," ").toLowerCase()} · ${i.standing}`+ownerText(i.owner)}),
   i.why?h("p",{class:"why",text:i.why}):null,
   h("div",{class:"factors"},...i.factors.map(f=>h("span",{class:"factor",title:f.detail},h("b",{text:"+"+f.points})," "+f.factor+": "+f.detail))),
   h("div",{class:"next"},h("b",{text:"Next: "}),i.next_step),
   i.links.length>1?h("div",{class:"links"},"Involves: ",...i.links.slice(1).map(id=>link({id,label:id.replace(/^.*:/,"")}))):null))}
function list(){
 const shown=data.items.filter(i=>(level==="ALL"||i.level===level)&&(category==="ALL"||i.category===category));
 const cats=[...new Set(data.items.map(i=>i.category))].sort();
 const btn=(text,on,fn)=>{const b=h("button",{type:"button","aria-pressed":String(on),text});b.addEventListener("click",fn);return b};
 return h("div",{class:"sec",id:"ranked"},h("h2",{},h("span",{text:"Ranked by importance"}),h("span",{text:`${shown.length} of ${data.total}`})),
  h("div",{class:"filters"},btn("All levels",level==="ALL",()=>{level="ALL";render()}),
   ...LEVELS.filter(l=>data.by_level[l]).map(l=>btn(`${l} ${data.by_level[l]}`,level===l,()=>{level=l;render()}))),
  h("div",{class:"filters"},btn("All areas",category==="ALL",()=>{category="ALL";render()}),
   ...cats.map(c=>btn(c,category===c,()=>{category=c;render()}))),
  ...(shown.length?shown.map(item):[h("p",{class:"empty",text:data.total?"Nothing at this level.":"Nothing needs attention in what the sources and feeds show."})]))}
function render(){
 const top=data.items[0],crit=data.by_level.CRITICAL||0,high=data.by_level.HIGH||0;
 const head=h("div",{class:"sec"},h("h2",{text:"Where the business stands"}),
  h("p",{class:"summary",text:data.total?`${data.total} thing${data.total>1?"s":""} need attention: ${crit} critical, ${high} high.`:"Nothing needs attention in what can be seen."}),
  top?h("p",{class:"note",text:"First: "+top.title+". "+top.next_step}):null,
  h("div",{class:"kpis"},...data.kpis.map(k=>h("div",{class:"kpi "+k.tone},h("b",{text:String(k.value)}),h("span",{text:k.label})))));
 const cov=h("div",{class:"sec"},h("h2",{text:"How much can be seen"}),
  ...data.coverage.rows.map(r=>h("div",{class:"cov",title:r.detail},h("div",{class:"row"},h("span",{text:r.label}),
   h("span",{class:"note",text:r.whole?`${r.part}/${r.whole} · ${r.percent}%`:"none yet"})),h("div",{class:"bar"},h("i",{style:`width:${r.percent||0}%`})))));
 const f=data.field;
 const field=h("div",{class:"sec"},h("h2",{},h("span",{text:"What a business like this should see"}),h("span",{text:f.field||"field unknown"})),
  h("p",{class:"note",text:f.detail,style:"margin-bottom:10px"}),
  ...f.checklist.map(c=>h("div",{class:"check"},h("span",{class:"mark "+c.status,text:c.status==="FOUND"?"FOUND":"NOT FOUND"}),
   h("span",{},c.item,c.suppliers.length?h("span",{class:"note",text:" · "+c.suppliers.join(", ")}):null,
    ...c.entities.slice(0,3).map(e=>h("span",{}," · ",link(e)))))));
 $("body").replaceChildren(head,h("div",{class:"two"},cov,field),list(),
  h("div",{class:"sec"},h("p",{class:"note",text:"Scores rank attention from named factors (severity, how much of the business reaches it, whether money moves through it); they are not probabilities or approvals. Every item links to its evidence. Nothing here changes anything."})))}
async function load(){
 try{const r=await fetch("/api/command",{cache:"no-store"});data=await r.json();if(!r.ok)throw new Error(data.status);render()}
 catch(err){$("body").replaceChildren(h("div",{class:"sec"},h("p",{class:"empty",text:"Not available: "+err.message})))}}
load();setInterval(()=>{if(!document.hidden)load()},15000);
</script>
</body></html>
