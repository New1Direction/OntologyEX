<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OntologyEX / Operations</title>
<style>
:root{color-scheme:dark;--bg:#060b12;--panel:#0b131d;--panel2:#0f1a26;--line:#1d2c3b;--line2:#2a3d50;
--text:#dbe7f0;--muted:#7f93a6;--faint:#4d6176;--accent:#4cc3d9;--ok:#34d399;--warn:#f2c14e;--risk:#ff5d5d;--impact:#ff9a3c;--person:#a78bfa;
--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--sans);min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:#08101a;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font:600 11px var(--mono);letter-spacing:.22em;color:var(--accent)}
.brand span{font-weight:600;font-size:15px}

nav a{padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:500}
nav a[aria-current="page"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
nav a:hover{text-decoration:none;color:var(--text)}
main{max-width:1200px;margin:0 auto;padding:0 0 40px}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 10px;font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.summary{font-size:18px;margin:0 0 6px;font-weight:600}.note{color:var(--muted);font-size:12px;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font:600 13px var(--sans);cursor:pointer;text-align:left}
.tab small{display:block;font:600 10px var(--mono);letter-spacing:.06em;color:var(--muted);margin-top:2px}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
.APPLIES{color:var(--impact)!important}.ASKED_BY_CUSTOMERS{color:var(--warn)!important}.NOT_INDICATED{color:var(--faint)!important}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2);margin:10px 0 6px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.risk{border:1px solid #5a2a2a;background:#160b0b;border-radius:8px;padding:10px 12px;margin:10px 0 0}
.risk b{color:var(--risk)}
.ctl{border-top:1px solid var(--line);padding:10px 0}
.ctl h3{margin:0;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ctl h3 code{font:600 11px var(--mono);color:var(--muted)}
.chip{display:inline-flex;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);font:600 10px var(--mono);letter-spacing:.05em;white-space:nowrap}
.SHOWN{color:var(--ok);border-color:#1f4a3a}.PARTLY_SHOWN{color:var(--warn);border-color:#5a4a1e}
.NOT_SHOWN_IN_SOURCES{color:var(--risk);border-color:#5a2a2a}.NEEDS_A_PERSON{color:var(--person);border-color:#3d3060}
.check{margin:6px 0 0 2px;font-size:12px;overflow-wrap:anywhere}
.yes{color:var(--ok)}.no{color:var(--faint)}
.cite{font:11px var(--mono);color:var(--faint);margin-left:16px;overflow-wrap:anywhere}
.person{font-size:12px;color:var(--person);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tile b{display:block;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:22px;font-weight:650;margin:2px 0 0;overflow-wrap:anywhere}.tile .s{font-size:12px;color:var(--muted)}
.up{color:var(--risk)}.down{color:var(--ok)}.flat{color:var(--muted)}
.sig{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}.sig:first-of-type{border-top:0}
.sig p{margin:0;min-width:0;overflow-wrap:anywhere}.sig strong{display:block}
.SHOWN{color:var(--ok);border-color:#1f4a3a}.PARTLY_SHOWN{color:var(--warn);border-color:#5a4a1e}
.NOT_SHOWN_IN_SOURCES{color:var(--risk);border-color:#5a2a2a}.NEEDS_A_PERSON{color:var(--person);border-color:#3d3060}
.ctl{border-top:1px solid var(--line);padding:10px 0}.ctl h3{margin:0;font-size:13px;color:var(--text);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.check{margin:4px 0 0;font-size:12.5px;overflow-wrap:anywhere}.cite{font:11px var(--mono);color:var(--faint);overflow-wrap:anywhere}
.CRITICAL{color:var(--risk);border-color:#5a2a2a}.HIGH{color:var(--impact);border-color:#5a3a1e}.MEDIUM{color:var(--warn);border-color:#5a4a1e}
.chart{width:100%;height:auto;display:block;margin:10px 0 4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
.list{margin:0;padding:0;list-style:none;font-size:12px}.list li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}
.list li span:last-child{color:var(--muted);font:12px var(--mono)}
h3{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.find{padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;overflow-wrap:anywhere}.find:first-of-type{border-top:0}
.find b{font:600 10px var(--mono);letter-spacing:.08em;color:var(--accent);margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 10px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.wrap{overflow-x:auto}.mono{font:11.5px var(--mono);overflow-wrap:anywhere}
.empty{color:var(--faint);margin:0}code{font:12px var(--mono);color:var(--text);background:var(--panel2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
</style></head>

<header>
 <div class="brand"><b>ONTOLOGYEX</b><span>Operations</span></div>

function chart(c,cur,inProgress){const pays=(c.streams.payments||[]),refs=c.streams.refunds||[];if(!pays.length)return null;

  if(i%Math.ceil(pays.length/8)===0){const t=s("text",{x:x+bw/2,y:H-3,"text-anchor":"middle",fill:"#7f93a6","font-size":"12"});t.textContent=w.week.slice(5);svg.append(t)}});

function counts(title,obj){const rows=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);if(!rows.length)return null;
 return h("div",{},h("h3",{text:title}),h("ul",{class:"list"},...rows.slice(0,8).map(([k,v])=>h("li",{},h("span",{text:k.replace(/_/g," ")}),h("span",{text:String(v)})))))}

 const t=c.totals||{};

  counts("Why customers disputed",t.disputes&&t.disputes.reasons),counts("Active plans",t.subscriptions&&t.subscriptions.plans));
 return h("div",{class:"sec"},h("h2",{},h("span",{text:`${cur.toUpperCase()} · ${c.first_week} to ${c.last_week}`}),h("span",{text:"last 4 complete weeks"})),tiles,
  chart(c,cur,d.week_in_progress),c.streams.payments?h("div",{class:"legend"},h("span",{style:"--c:#4cc3d9",text:"payments taken"}),h("span",{style:"--c:#ff5d5d",text:"refunds"}),h("span",{style:"--c:#24485a",text:"week in progress"})):null,
  breakdowns.childElementCount?breakdowns:null)}
// Where the money goes: bank and card lines, bills, cloud costs, by month; suppliers paid against suppliers the code uses.
const SPEND_FIND={PAID_AND_IN_CODE:"PAID · USED",PAID_NOT_IN_CODE:"PAID · NOT IN THE CODE",IN_CODE_NOT_PAID:"IN THE CODE · NOT PAID"};
function moneyBars(rows,cur,live){const W=1000,H=170,pad=18,bw=(W-pad)/Math.max(1,rows.length),max=Math.max(1,...rows.flatMap(r=>[r.in||0,r.out||0]));
 const svg=s("svg",{class:"chart",viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Money in and out by month"});
 rows.forEach((r,i)=>{const x=pad+i*bw,half=Math.max(2,(bw-10)/2),isLive=r.month>=live;
  for(const [k,j,color] of [["in",0,"#34d399"],["out",1,"#ff9a3c"]]){const v=r[k]||0,hgt=(H-24)*v/max;
   const bar=s("rect",{x:x+4+j*half,y:H-16-hgt,width:half-2,height:Math.max(0,hgt),rx:2,fill:color,opacity:isLive?0.35:r.withheld?0.25:0.9});
   bar.append(s("title"));bar.lastChild.textContent=`${r.month}${isLive?" (in progress)":""}: money ${k} ${money(r[k],cur)}`;svg.append(bar)}
  const t=s("text",{x:x+bw/2,y:H-3,"text-anchor":"middle",fill:"#7f93a6","font-size":"12"});t.textContent=r.month;svg.append(t)});

function amounts(title,obj,cur){const rows=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);if(!rows.length)return null;

function spendSection(d){const sp=d.spend;if(!sp||!Object.keys(sp.currencies).length)return [];const out=[];

   h("span",{},`${money(c.reconciliation.payouts,cur)} paid out · ${money(c.reconciliation.deposits,cur)} deposited, ${c.reconciliation.months.join(", ")}`)));
  const t=c.totals||{};
  const supplierRows=(c.suppliers_paid||[]).map(p=>h("tr",{},h("td",{text:p.name}),h("td",{text:p.category||""}),h("td",{text:money(p.amount,cur)}),
   h("td",{text:SPEND_FIND[usedBy[p.name]]||(p.category==="payments"?"payment processor":"–")})));
  const unpaid=(sp.suppliers_vs_spend||[]).filter(f=>f.finding==="IN_CODE_NOT_PAID");
  out.push(h("div",{class:"sec"},h("h2",{},h("span",{text:`Spend · ${cur.toUpperCase()} · ${c.first_month} to ${c.last_month}`}),h("span",{text:"by month"})),tiles,
   tx.length?moneyBars(tx,cur,d.month_in_progress):null,tx.length?h("div",{class:"legend"},h("span",{style:"--c:#34d399",text:"money in"}),h("span",{style:"--c:#ff9a3c",text:"money out"})):null,
   h("div",{class:"cols"},amounts("Where money went",t.transactions&&t.transactions.categories,cur),amounts("Cloud, by service",t.cloud_costs&&t.cloud_costs.services,cur)),
   supplierRows.length?h("div",{style:"margin-top:12px"},h("h3",{text:"Suppliers paid, and whether the code uses them"}),
    h("div",{class:"wrap"},h("table",{},h("tr",{},...["Supplier","Kind","Paid","In the code"].map(x=>h("th",{text:x}))),...supplierRows))):null,

// Customers: what they ask support about and what sales closes, joined with the payment records.
function counted(title,obj){const rows=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);if(!rows.length)return null;
 return h("div",{},h("h3",{text:title}),h("ul",{class:"list"},...rows.slice(0,8).map(([k,v])=>h("li",{},h("span",{text:k.replace(/_/g," ")}),h("span",{text:String(v)})))))}
function ticketBars(rows,live){const W=1000,H=150,pad=18,bw=(W-pad)/Math.max(1,rows.length),max=Math.max(1,...rows.map(r=>Math.max(r.opened,r.backlog)));
 const svg=s("svg",{class:"chart",viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Tickets opened and open backlog by week"});
 rows.forEach((r,i)=>{const x=pad+i*bw,hgt=(H-24)*r.opened/max,isLive=r.week>=live;
  const bar=s("rect",{x:x+2,y:H-16-hgt,width:Math.max(2,bw-4),height:hgt,rx:2,fill:isLive?"#24485a":"#a78bfa",opacity:0.9});

function customersSection(d){const c=d.customers;if(!c)return [];const r=c.recent||{},t=r.tickets,dl=r.deals,tiles=h("div",{class:"tiles"});
 if(t)tiles.append(tile("Tickets, 4 weeks",String(t.opened),delta(t.opened,t.opened_before,true)),
