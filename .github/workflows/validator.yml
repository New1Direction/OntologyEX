name: Validator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and case dependencies
        run: python -m pip install -r examples/cachetools-domain/requirements-case.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate every bundled example
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          examples = sorted(Path('examples').glob('eval-*/*/10-upper.yaml'))
          if len(examples) < 5:
              raise SystemExit(f'Expected at least five bundled examples, found {len(examples)}')
          for upper in examples:
              print(f'Validating {upper.parent}', flush=True)
              subprocess.run(
                  [sys.executable, 'ontology-extraction/scripts/scaffold.py', 'validate', str(upper.parent)],
                  check=True,
                  timeout=30,
              )
      - name: Run source-to-skill update demo
        run: python examples/payments-domain/demo.py --out build/ci-domain-skill
      - name: Check reproducible public report
        shell: python
        run: |
          from pathlib import Path
          generated = Path('build/ci-domain-skill/v2/payments-domain/report.html').read_bytes()
          committed = Path('docs/payments-demo.html').read_bytes()
          if generated != committed:
              raise SystemExit('Regenerate docs/payments-demo.html from the v2 demo')
      - name: Run guided real-source onboarding case
        run: python examples/cachetools-domain/case.py --out build/ci-cachetools-case
