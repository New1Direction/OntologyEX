name: Adaptive Layout Verification
on:
  pull_request:
    paths:
      - 'ontology-extraction/scripts/layout_engine.js'
      - 'ontology-extraction/scripts/control_room.py'
      - 'tests/layout_engine.test.cjs'
      - 'tests/layout_browser_smoke.py'
      - 'scripts/layout_benchmark.cjs'
      - '.github/workflows/layout-engine.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node JavaScript geometry and accessibility invariants
        run: node --test tests/layout_engine.test.cjs
      - name: Measure solver and bounded graph baseline
        run: node scripts/layout_benchmark.cjs --check
