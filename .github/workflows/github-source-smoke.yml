name: Real GitHub Source Discovery
on:
  pull_request:
    paths:
      - 'ontology-extraction/scripts/github_discovery.py'
      - 'ontology-extraction/scripts/discover_repo.py'
      - 'tests/test_github_discovery.py'
      - '.github/workflows/github-source-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repoing-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install existing parser dependency
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Read public repo.ing commit-pinned manifest inventory
        env:
          ONTOLOGYEX_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python ontology-extraction/scripts/github_discovery.py \
            --repo New1Direction/repo.ing > "$RUNNER_TEMP/repoing-discovery.json"
      - name: Validate actual source provenance and explicit unknown health
        run: |
          python - "$RUNNER_TEMP/repoing-discovery.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['kind']=='UNREVIEWED_BUSINESS_DISCOVERY_PREVIEW'
          assert x['source']['full_name']=='New1Direction/repo.ing'
          assert len(x['source']['commit_sha'])==40
          assert x['source']['integrity']=='COMMIT_PINNED_BLOBS_VALIDATED'
          assert x['coverage']['candidate_manifests']>=3
          assert x['coverage']['files_with_evidence']>=3
          assert x['runtime_health']=='UNKNOWN'
          assert x['execution_authorized'] is False
          assert all(e['git_blob_sha'] for e in x['source_evidence'])
          assert x['ci_source_status']=='GITHUB_ACTIONS_RESPONSE_RECEIVED'
          assert x['ci_evidence'] and all(
              c['head_sha']==x['source']['commit_sha'] and
              c['scope']=='CI_ONLY_NOT_PRODUCTION_HEALTH'
              for c in x['ci_evidence'])
          print('CI evidence for pinned commit:',len(x['ci_evidence']),'workflow runs')
          print('repo.ing source discovery validated:',
                len(x['nodes']), 'nodes,',len(x['edges']), 'edges,',
                x['coverage']['candidate_manifests'],'manifests; production health UNKNOWN')
          PY
      - name: No persistent artifact upload
        run: rm -f "$RUNNER_TEMP/repoing-discovery.json"
