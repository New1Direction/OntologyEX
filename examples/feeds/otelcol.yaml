# OpenTelemetry Collector: forward the spans of calls between services to the OntologyEX
# feed receiver (server spans for health, client and server spans for observed calls).
# Applications keep exporting to the Collector as usual; nothing in them changes.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4319

processors:
  batch: {}
  # Server spans give health; client and producer spans pair with server and consumer
  # spans into observed calls. Spans inside one service are not used; dropping them
  # saves bandwidth.
  filter/call_spans:
    error_mode: ignore
    traces:
      span:
        - kind == SPAN_KIND_INTERNAL
        - kind == SPAN_KIND_UNSPECIFIED

exporters:
  otlphttp/ontologyex:
    traces_endpoint: http://127.0.0.1:4318/v1/traces
    encoding: proto            # json also works
    compression: gzip
    headers:
      Authorization: "Bearer ${env:ONTOLOGYEX_OTLP_TOKEN}"

service:
  pipelines:
    traces/ontologyex:
      receivers: [otlp]
      processors: [filter/call_spans, batch]
      exporters: [otlphttp/ontologyex]
