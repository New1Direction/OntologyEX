[package]
name = "ontologyex-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded, deterministic graph state and health projection for OntologyEX"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[lib]
name = "ontologyex_core"
path = "src/lib.rs"

[[bin]]
name = "ontologyex-core"
path = "src/main.rs"
